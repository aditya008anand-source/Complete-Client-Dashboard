name: Weekly Dr Report Email

on:
  schedule:
    - cron: '30 0 * * 1'
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Send ZBM (Zone) Reports
        run: |
          echo "Sending Zone reports..."
          curl -s "https://mysaathi-dashboard.vercel.app/api/weekly-report?type=ZBM"
          echo ""
          echo "ZBM done."

      - name: Wait 15 seconds
        run: sleep 15

      - name: Send RBM (Region) Reports - Batch 1
        run: |
          echo "Sending Region reports batch 1..."
          curl -s "https://mysaathi-dashboard.vercel.app/api/weekly-report?type=RBM&page=1"
          echo ""
          echo "RBM batch 1 done."

      - name: Wait 15 seconds
        run: sleep 15

      - name: Send RBM (Region) Reports - Batch 2
        run: |
          echo "Sending Region reports batch 2..."
          curl -s "https://mysaathi-dashboard.vercel.app/api/weekly-report?type=RBM&page=2"
          echo ""
          echo "RBM batch 2 done."

      - name: Wait 15 seconds
        run: sleep 15

      - name: Send RBM (Region) Reports - Batch 3
        run: |
          echo "Sending Region reports batch 3..."
          curl -s "https://mysaathi-dashboard.vercel.app/api/weekly-report?type=RBM&page=3"
          echo ""
          echo "All done."
