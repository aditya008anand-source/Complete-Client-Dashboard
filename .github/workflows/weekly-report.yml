name: Weekly Dr Report Email

on:
  schedule:
    - cron: '30 0 * * 1'
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Send ZBM (Zone) Reports
        run: |
          echo "Sending Zone reports..."
          curl -s "https://mysaathi-dashboard.vercel.app/api/weekly-report?type=ZBM"
          echo ""
          echo "ZBM done. Waiting 10 seconds..."
          sleep 10

      - name: Send RBM (Region) Reports
        run: |
          echo "Sending Region reports..."
          curl -s "https://mysaathi-dashboard.vercel.app/api/weekly-report?type=RBM"
          echo ""
          echo "RBM done."
