name: Weekly Dr Report Email

on:
  schedule:
    - cron: '30 0 * * 1'
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Send ZBM (Zone) Reports
        run: |
          echo "Sending Zone reports..."
          curl -s --max-time 120 "https://mysaathi-dashboard.vercel.app/api/weekly-report?type=ZBM"
          echo ""

      - name: Wait 30 seconds
        run: sleep 30

      - name: Send RBM Batch 1
        run: |
          echo "Sending Region batch 1..."
          curl -s --max-time 120 "https://mysaathi-dashboard.vercel.app/api/weekly-report?type=RBM&page=1"
          echo ""

      - name: Wait 30 seconds
        run: sleep 30

      - name: Send RBM Batch 2
        run: |
          echo "Sending Region batch 2..."
          curl -s --max-time 120 "https://mysaathi-dashboard.vercel.app/api/weekly-report?type=RBM&page=2"
          echo ""

      - name: Wait 30 seconds
        run: sleep 30

      - name: Send RBM Batch 3
        run: |
          echo "Sending Region batch 3..."
          curl -s --max-time 120 "https://mysaathi-dashboard.vercel.app/api/weekly-report?type=RBM&page=3"
          echo ""
          echo "All done."
